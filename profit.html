```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>연결재무실적 - 이익</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <div>
      <h1>연결재무실적</h1>
      <p>회사별 월간 실적을 한눈에 확인하세요.</p>
    </div>

    <div class="month-select">
      <label for="month">실적월</label>

      <select id="month">
        <option>2026년 7월</option>
      </select>
    </div>

  </header>


  <nav class="nav">
    <a href="index.html">매출액</a>
    <a href="profit.html" class="active">이익</a>
  </nav>


  <main class="container">

    <section class="page-title">

      <div>
        <span class="eyebrow">2026년 7월</span>
        <h2>회사별 이익</h2>
      </div>

      <span class="unit">단위 : 억원</span>

    </section>


    <div id="loading" class="message">
      데이터를 불러오는 중입니다...
    </div>

    <div id="error" class="message error-message"></div>


    <!-- 영업이익 -->

    <section class="chart-card">

      <div class="chart-header">
        <div>
          <h3>영업이익</h3>
          <p>회사별 영업이익을 비교해보세요.</p>
        </div>
      </div>


      <div class="chart-scroll">

        <div id="operatingProfitChart" class="chart profit-chart">
        </div>

      </div>

    </section>


    <!-- 당기순이익 -->

    <section class="chart-card">

      <div class="chart-header">
        <div>
          <h3>당기순이익</h3>
          <p>회사별 당기순이익을 비교해보세요.</p>
        </div>
      </div>


      <div class="chart-scroll">

        <div id="netIncomeChart" class="chart profit-chart">
        </div>

      </div>

    </section>

  </main>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbz21PZfzi4wgqOD-rcFI6Gj0bdFgWPOE3JPysFvZG051wpOkbcaWF_b2lx65CrpHZS2PA/exec";


    /*
     * Google Sheets의 금액은 원 단위입니다.
     * 1억원 = 100,000,000원
     */
    const WON_PER_EOK = 100000000;


    loadData();


    /*
     * Google Sheets에서 데이터를 가져옵니다.
     */
    async function loadData() {

      const loading =
        document.getElementById("loading");

      const error =
        document.getElementById("error");


      try {

        const response =
          await fetch(API_URL);


        if (!response.ok) {
          throw new Error(
            "데이터를 불러오지 못했습니다."
          );
        }


        const result =
          await response.json();


        if (!result.success) {
          throw new Error(
            result.message ||
            "데이터를 불러오지 못했습니다."
          );
        }


        drawProfitChart(
          result.data,
          "영업이익",
          "operatingProfitChart"
        );


        drawProfitChart(
          result.data,
          "당기순이익",
          "netIncomeChart"
        );


        loading.style.display = "none";


      } catch (err) {

        loading.style.display = "none";

        error.textContent =
          "데이터를 불러오는 중 문제가 발생했습니다. " +
          err.message;

        error.style.display = "block";
      }

    }


    /*
     * 영업이익 / 당기순이익 그래프를 그립니다.
     */
    function drawProfitChart(
      data,
      fieldName,
      chartId
    ) {

      const chart =
        document.getElementById(chartId);


      chart.innerHTML = "";


      if (!data || data.length === 0) {

        chart.innerHTML =
          '<div class="empty-message">저장된 실적이 없습니다.</div>';

        return;
      }


      /*
       * 원 → 억원으로 변환
       */
      const convertedData = data.map(item => {

        return {
          company: item["회사"],
          value:
            Number(item[fieldName]) /
            WON_PER_EOK
        };

      });


      /*
       * 가장 큰 양수 / 음수의 절댓값을 찾습니다.
       */
      const maxValue = Math.max(
        ...convertedData.map(item => item.value)
      );


      const minValue = Math.min(
        ...convertedData.map(item => item.value)
      );


      const maxAbs =
        Math.max(
          Math.abs(maxValue),
          Math.abs(minValue),
          1
        );


      /*
       * 0 기준선
       */
      const zeroLine =
        document.createElement("div");

      zeroLine.className = "zero-line";

      chart.appendChild(zeroLine);


      /*
       * 회사별 막대 생성
       */
      convertedData.forEach(function(item) {

        const value = item.value;


        const barItem =
          document.createElement("div");

        barItem.className =
          "bar-item profit-bar-item";


        /*
         * 막대 높이
         *
         * 최대값을 그래프 높이의 42% 정도로 표시합니다.
         */
        const height =
          Math.abs(value) /
          maxAbs *
          42;


        /*
         * 회사명
         */
        const company =
          document.createElement("div");

        company.className = "company";

        company.textContent =
          item.company;


        /*
         * 숫자
         */
        const valueLabel =
          document.createElement("div");

        valueLabel.className =
          "bar-value";


        valueLabel.textContent =
          formatNumber(value);


        /*
         * 막대
         */
        const bar =
          document.createElement("div");

        bar.className = "bar";


        /*
         * CSS에서 막대 높이를 계산할 수 있도록
         * --bar-height라는 값을 전달합니다.
         */
        barItem.style.setProperty(
          "--bar-height",
          height + "%"
        );


        bar.style.height =
          height + "%";


        /*
         * 양수
         *
         * 숫자 → 막대 → 0 기준선
         */
        if (value >= 0) {

          bar.classList.add("positive");

          valueLabel.classList.add(
            "positive-value"
          );


          barItem.appendChild(
            valueLabel
          );

          barItem.appendChild(
            bar
          );

        }


        /*
         * 음수
         *
         * 0 기준선 → 막대 → 숫자
         */
        else {

          bar.classList.add("negative");

          valueLabel.classList.add(
            "negative-value"
          );


          barItem.appendChild(
            bar
          );

          barItem.appendChild(
            valueLabel
          );

        }


        barItem.appendChild(
          company
        );


        chart.appendChild(
          barItem
        );

      });

    }


    /*
     * 숫자를 보기 좋게 표시합니다.
     *
     * 예:
     * 1250 → 1,250
     * -70 → -70
     */
    function formatNumber(value) {

      return value.toLocaleString(
        "ko-KR",
        {
          maximumFractionDigits: 1
        }
      );

    }


    /*
     * 나중에 저장 기능을 추가할 때 사용할 함수입니다.
     */
    async function saveData(
      company,
      sales,
      operatingProfit,
      netIncome
    ) {

      const data = {

        "회사": company,

        "매출액": sales,

        "영업이익": operatingProfit,

        "당기순이익": netIncome

      };


      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "text/plain"
          },

          body: JSON.stringify(data)

        });


      return await response.json();

    }

  </script>

</body>
</html>
```
