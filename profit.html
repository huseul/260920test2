```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>연결재무실적 - 이익</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* ==================================================
       이익 그래프 전용 스타일
       숫자가 막대 안으로 들어가지 않도록
       막대와 숫자를 하나의 그룹으로 구성합니다.
    ================================================== */

    .profit-chart {
      position: relative;
      height: 440px;
      min-width: 1800px;

      display: flex;
      align-items: stretch;
      gap: 28px;

      padding: 0 35px;

      border-bottom: 1px solid #ded7ce;
    }

    /* 회사 하나 */
    .profit-item {
      width: 48px;
      min-width: 48px;

      height: 100%;

      position: relative;
    }

    /* 0 기준선 */
    .profit-zero-line {
      position: absolute;

      left: 35px;
      right: 35px;

      top: 50%;

      border-top: 1px solid #cfc6bb;

      z-index: 1;
    }

    /* 막대와 숫자를 담는 영역 */
    .profit-bar-area {
      position: absolute;

      left: 0;
      right: 0;

      top: 0;
      bottom: 0;
    }

    /* 실제 막대 */
    .profit-bar {
      position: absolute;

      left: 3px;

      width: 42px;

      border-radius: 7px 7px 0 0;

      z-index: 2;
    }

    /* 양수 막대 */
    .profit-bar.positive {
      bottom: 50%;

      background: #79a77e;
    }

    /* 음수 막대 */
    .profit-bar.negative {
      top: 50%;

      border-radius: 0 0 7px 7px;

      background: #d8756d;
    }

    /* 숫자 */
    .profit-value {
      position: absolute;

      left: 50%;

      transform: translateX(-50%);

      font-size: 12px;

      font-weight: 700;

      white-space: nowrap;

      z-index: 5;
    }

    /* 양수 숫자 */
    .profit-value.positive {
      color: #4f7054;
    }

    /* 음수 숫자 */
    .profit-value.negative {
      color: #a85852;
    }

    /* 회사명 */
    .profit-company {
      position: absolute;

      left: 50%;

      bottom: 12px;

      transform: translateX(-50%);

      color: #625a53;

      font-size: 12px;

      font-weight: 600;

      white-space: nowrap;

      z-index: 5;
    }
  </style>

</head>


<body>


  <header class="header">

    <div>
      <h1>연결재무실적</h1>
      <p>회사별 월간 실적을 한눈에 확인하세요.</p>
    </div>

    <div class="month-select">

      <label for="month">
        실적월
      </label>

      <select id="month">
        <option>2026년 7월</option>
      </select>

    </div>

  </header>


  <nav class="nav">

    <a href="index.html">
      매출액
    </a>

    <a href="profit.html" class="active">
      이익
    </a>

  </nav>


  <main class="container">


    <section class="page-title">

      <div>

        <span class="eyebrow">
          2026년 7월
        </span>

        <h2>
          회사별 이익
        </h2>

      </div>

      <span class="unit">
        단위 : 억원
      </span>

    </section>


    <div id="loading" class="message">
      데이터를 불러오는 중입니다...
    </div>


    <div id="error" class="message error-message">
    </div>


    <!-- =========================
         영업이익
    ========================== -->

    <section class="chart-card">

      <div class="chart-header">

        <div>

          <h3>
            영업이익
          </h3>

          <p>
            회사별 영업이익을 비교해보세요.
          </p>

        </div>

      </div>


      <div class="chart-scroll">

        <div
          id="operatingProfitChart"
          class="profit-chart">
        </div>

      </div>

    </section>


    <!-- =========================
         당기순이익
    ========================== -->

    <section class="chart-card">

      <div class="chart-header">

        <div>

          <h3>
            당기순이익
          </h3>

          <p>
            회사별 당기순이익을 비교해보세요.
          </p>

        </div>

      </div>


      <div class="chart-scroll">

        <div
          id="netIncomeChart"
          class="profit-chart">
        </div>

      </div>

    </section>


  </main>


  <script>


    const API_URL =
      "https://script.google.com/macros/s/AKfycbz21PZfzi4wgqOD-rcFI6Gj0bdFgWPOE3JPysFvZG051wpOkbcaWF_b2lx65CrpHZS2PA/exec";


    /*
     * Google Sheets의 금액은 원 단위
     *
     * 100,000,000원 = 1억원
     */
    const WON_PER_EOK = 100000000;


    loadData();


    /*
     * 데이터를 가져옵니다.
     */
    async function loadData() {

      const loading =
        document.getElementById("loading");

      const error =
        document.getElementById("error");


      try {

        const response =
          await fetch(API_URL);


        if (!response.ok) {

          throw new Error(
            "데이터를 불러오지 못했습니다."
          );

        }


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            "데이터를 불러오지 못했습니다."
          );

        }


        drawProfitChart(
          result.data,
          "영업이익",
          "operatingProfitChart"
        );


        drawProfitChart(
          result.data,
          "당기순이익",
          "netIncomeChart"
        );


        loading.style.display = "none";


      } catch (err) {

        loading.style.display = "none";

        error.textContent =
          "데이터를 불러오는 중 문제가 발생했습니다. " +
          err.message;

        error.style.display = "block";

      }

    }


    /*
     * 이익 그래프를 만듭니다.
     */
    function drawProfitChart(
      data,
      fieldName,
      chartId
    ) {


      const chart =
        document.getElementById(chartId);


      chart.innerHTML = "";


      if (!data || data.length === 0) {

        chart.innerHTML =
          '<div class="empty-message">' +
          '저장된 실적이 없습니다.' +
          '</div>';

        return;

      }


      /*
       * 원 → 억원
       */
      const convertedData =
        data.map(function(item) {

          return {

            company:
              item["회사"],

            value:
              Number(item[fieldName]) /
              WON_PER_EOK

          };

        });


      /*
       * 가장 큰 값의 절댓값을 구합니다.
       */
      const maxAbs =
        Math.max(
          ...convertedData.map(
            item => Math.abs(item.value)
          ),
          1
        );


      /*
       * 0 기준선
       */
      const zeroLine =
        document.createElement("div");

      zeroLine.className =
        "profit-zero-line";

      chart.appendChild(zeroLine);


      /*
       * 회사별 그래프
       */
      convertedData.forEach(
        function(item) {


          const value =
            item.value;


          /*
           * 회사 하나의 영역
           */
          const companyItem =
            document.createElement("div");

          companyItem.className =
            "profit-item";


          /*
           * 막대와 숫자가 들어갈 영역
           */
          const barArea =
            document.createElement("div");

          barArea.className =
            "profit-bar-area";


          /*
           * 막대 높이
           *
           * 최대값 = 40%
           */
          const height =
            Math.abs(value) /
            maxAbs *
            40;


          /*
           * 막대
           */
          const bar =
            document.createElement("div");

          bar.className =
            "profit-bar";


          bar.style.height =
            height + "%";


          /*
           * 숫자
           */
          const valueLabel =
            document.createElement("div");

          valueLabel.className =
            "profit-value";


          valueLabel.textContent =
            formatNumber(value);


          /*
           * 양수
           */
          if (value >= 0) {


            bar.classList.add(
              "positive"
            );


            valueLabel.classList.add(
              "positive"
            );


            /*
             * 숫자는 막대 바로 위
             *
             * 막대 높이가 40%라면
             * 숫자는 50% + 40% + 약간의 여백
             */
            valueLabel.style.bottom =
              "calc(50% + " +
              height +
              "% + 8px)";


            barArea.appendChild(
              valueLabel
            );

            barArea.appendChild(
              bar
            );


          }


          /*
           * 음수
           */
          else {


            bar.classList.add(
              "negative"
            );


            valueLabel.classList.add(
              "negative"
            );


            /*
             * 숫자는 막대 바로 아래
             */
            valueLabel.style.top =
              "calc(50% + " +
              height +
              "% + 8px)";


            barArea.appendChild(
              bar
            );

            barArea.appendChild(
              valueLabel
            );

          }


          /*
           * 회사명
           */
          const companyName =
            document.createElement("div");


          companyName.className =
            "profit-company";


          companyName.textContent =
            item.company;


          /*
           * 화면에 추가
           */
          companyItem.appendChild(
            barArea
          );

          companyItem.appendChild(
            companyName
          );


          chart.appendChild(
            companyItem
          );

        }
      );

    }


    /*
     * 숫자 표시
     */
    function formatNumber(value) {

      return value.toLocaleString(
        "ko-KR",
        {
          maximumFractionDigits: 1
        }
      );

    }


  </script>


</body>
</html>
