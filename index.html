```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>연결재무실적</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 상단 -->
  <header class="header">

    <div>
      <h1>연결재무실적</h1>
      <p>회사별 월간 실적을 한눈에 확인하세요.</p>
    </div>

    <div class="month-select">
      <label for="month">실적월</label>

      <select id="month">
        <option>2026년 7월</option>
      </select>
    </div>

  </header>


  <!-- 메뉴 -->
  <nav class="nav">

    <a href="index.html" class="active">
      매출액
    </a>

    <a href="profit.html">
      이익
    </a>

  </nav>


  <!-- 본문 -->
  <main class="container">

    <section class="page-title">

      <div>
        <span class="eyebrow">2026년 7월</span>
        <h2>회사별 매출액</h2>
      </div>

      <span class="unit">
        단위 : 억원
      </span>

    </section>


    <!-- 로딩 메시지 -->
    <div id="loading" class="message">
      데이터를 불러오는 중입니다...
    </div>


    <!-- 오류 메시지 -->
    <div id="error" class="message error-message">
    </div>


    <!-- 그래프 -->
    <section class="chart-card">

      <div class="chart-header">

        <div>
          <h3>매출액</h3>
          <p>회사별 매출액을 비교해보세요.</p>
        </div>

      </div>


      <div id="salesChart" class="chart">
      </div>

    </section>

  </main>


  <script>

    /*
     * Google Apps Script 웹앱 주소
     */
    const API_URL =
      "https://script.google.com/macros/s/AKfycbz21PZfzi4wgqOD-rcFI6Gj0bdFgWPOE3JPysFvZG051wpOkbcaWF_b2lx65CrpHZS2PA/exec";


    /*
     * 페이지가 열리면 Google Sheets 데이터를 가져옵니다.
     */
    loadData();


    async function loadData() {

      const loading = document.getElementById("loading");
      const error = document.getElementById("error");

      try {

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("데이터를 불러오지 못했습니다.");
        }

        const result = await response.json();

        if (!result.success) {
          throw new Error(
            result.message || "데이터를 불러오지 못했습니다."
          );
        }

        drawSalesChart(result.data);

        loading.style.display = "none";

      } catch (err) {

        loading.style.display = "none";

        error.textContent =
          "데이터를 불러오는 중 문제가 발생했습니다. " +
          err.message;

        error.style.display = "block";

      }

    }


    /*
     * 매출액 그래프를 그립니다.
     */
    function drawSalesChart(data) {

      const chart = document.getElementById("salesChart");

      chart.innerHTML = "";

      if (!data || data.length === 0) {

        chart.innerHTML =
          '<div class="empty-message">저장된 실적이 없습니다.</div>';

        return;
      }


      /*
       * 매출액 중 가장 큰 값을 찾습니다.
       * 가장 큰 막대를 100% 높이로 사용합니다.
       */
      const maxValue = Math.max(
        ...data.map(item => Number(item["매출액"]) || 0)
      );


      data.forEach(function(item) {

        const value = Number(item["매출액"]) || 0;

        let height = 0;

        if (maxValue > 0) {
          height = (value / maxValue) * 100;
        }


        const barItem = document.createElement("div");

        barItem.className = "bar-item";


        barItem.innerHTML = `
          <div class="bar-value">
            ${formatNumber(value)}
          </div>

          <div
            class="bar"
            style="height: ${height}%;">
          </div>

          <div class="company">
            ${escapeHtml(item["회사"])}
          </div>
        `;


        chart.appendChild(barItem);

      });

    }


    /*
     * 숫자를 보기 좋게 표시합니다.
     * 예: 1250 → 1,250
     */
    function formatNumber(value) {

      return value.toLocaleString("ko-KR", {
        maximumFractionDigits: 2
      });

    }


    /*
     * 회사명에 특수문자가 들어가도
     * HTML에 안전하게 표시되도록 합니다.
     */
    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
     * 나중에 저장 기능을 추가할 때 사용하는 함수입니다.
     *
     * Content-Type은 반드시 text/plain으로 보냅니다.
     */
    async function saveData(company, sales, operatingProfit, netIncome) {

      const data = {
        "회사": company,
        "매출액": sales,
        "영업이익": operatingProfit,
        "당기순이익": netIncome
      };


      const response = await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type": "text/plain"
        },

        body: JSON.stringify(data)

      });


      return await response.json();

    }

  </script>

</body>
</html>
