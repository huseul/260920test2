```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>연결재무실적</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <div>
      <h1>연결재무실적</h1>
      <p>회사별 월간 실적을 한눈에 확인하세요.</p>
    </div>

    <div class="month-select">
      <label for="month">실적월</label>

      <select id="month">
        <option value="2026년 7월">2026년 7월</option>
        <option value="2026년 8월">2026년 8월</option>
      </select>
    </div>

  </header>


  <nav class="nav">
    <a href="index.html" class="active">매출액</a>
    <a href="profit.html">이익</a>
  </nav>


  <main class="container">

    <section class="page-title">

      <div>
        <span id="monthTitle" class="eyebrow">
          2026년 7월
        </span>

        <h2>회사별 매출액</h2>
      </div>

      <span class="unit">단위 : 억원</span>

    </section>


    <div id="loading" class="message">
      데이터를 불러오는 중입니다...
    </div>

    <div id="error" class="message error-message"></div>


    <section class="chart-card">

      <div class="chart-header">

        <div>
          <h3>매출액</h3>
          <p>회사별 매출액을 비교해보세요.</p>
        </div>

      </div>


      <div class="chart-scroll">

        <div id="salesChart" class="chart"></div>

      </div>

    </section>

  </main>


  <script>

    /*
     * Google Apps Script 웹앱 주소
     */
    var API_URL =
      "https://script.google.com/macros/s/AKfycbwpXgcyI4FnRwRhrsEfAfjvAbWk4jy3kTl0p0lN6lGjw4nqFcGWdN_TUp_iiW4Fm8PmtQ/exec";


    /*
     * 원 → 억원
     */
    var WON_PER_EOK = 100000000;


    /*
     * HTML 요소
     */
    var monthSelect =
      document.getElementById("month");

    var monthTitle =
      document.getElementById("monthTitle");


    /*
     * 처음 화면이 열리면
     * 현재 선택된 월의 데이터를 가져옵니다.
     */
    loadData(monthSelect.value);


    /*
     * 월을 바꿨을 때 실행
     */
    monthSelect.addEventListener(
      "change",
      function () {

        var selectedMonth =
          monthSelect.value;

        monthTitle.textContent =
          selectedMonth;

        loadData(selectedMonth);

      }
    );


    /*
     * Google Sheets 데이터 가져오기
     */
    async function loadData(month) {

      var loading =
        document.getElementById("loading");

      var error =
        document.getElementById("error");

      loading.style.display =
        "block";

      error.style.display =
        "none";


      try {

        var url =
          API_URL +
          "?month=" +
          encodeURIComponent(month);


        var response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "서버 응답 오류: " +
            response.status
          );

        }


        var result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            "데이터를 불러오지 못했습니다."
          );

        }


        /*
         * 매출액 그래프 그리기
         */
        drawSalesChart(
          result.data
        );


        loading.style.display =
          "none";


      } catch (err) {

        loading.style.display =
          "none";

        error.textContent =
          "데이터를 불러오는 중 문제가 발생했습니다. " +
          err.message;

        error.style.display =
          "block";

        document.getElementById(
          "salesChart"
        ).innerHTML = "";

      }

    }


    /*
     * 매출액 그래프
     */
    function drawSalesChart(data) {

      var chart =
        document.getElementById(
          "salesChart"
        );


      chart.innerHTML = "";


      if (
        !data ||
        data.length === 0
      ) {

        chart.innerHTML =
          '<div class="empty-message">' +
          '저장된 실적이 없습니다.' +
          '</div>';

        return;

      }


      /*
       * 원 → 억원
       */
      var convertedData =
        data.map(
          function (item) {

            return {

              company:
                item["회사"],

              value:
                Number(
                  item["매출액"]
                ) /
                WON_PER_EOK

            };

          }
        );


      /*
       * 최대 매출액
       */
      var maxValue =
        Math.max.apply(
          null,
          convertedData.map(
            function (item) {
              return item.value;
            }
          )
        );


      /*
       * 회사별 막대
       */
      convertedData.forEach(
        function (item) {

          var height =
            maxValue > 0
              ? (
                  item.value /
                  maxValue
                ) * 100
              : 0;


          var barItem =
            document.createElement(
              "div"
            );


          barItem.className =
            "bar-item";


          /*
           * 템플릿 리터럴을 사용하지 않고
           * 각각의 HTML 요소를 직접 만듭니다.
           */
          var value =
            document.createElement(
              "div"
            );

          value.className =
            "bar-value";

          value.textContent =
            formatNumber(
              item.value
            );


          var bar =
            document.createElement(
              "div"
            );

          bar.className =
            "bar";

          bar.style.height =
            height + "%";


          var company =
            document.createElement(
              "div"
            );

          company.className =
            "company";

          company.textContent =
            item.company;


          /*
           * 회사 하나의 막대 구성
           */
          barItem.appendChild(
            value
          );

          barItem.appendChild(
            bar
          );

          barItem.appendChild(
            company
          );


          chart.appendChild(
            barItem
          );

        }
      );

    }


    /*
     * 숫자 표시
     */
    function formatNumber(value) {

      return value.toLocaleString(
        "ko-KR",
        {
          maximumFractionDigits: 1
        }
      );

    }


    /*
     * 나중에 사용할 저장 함수
     */
    async function saveData(
      month,
      company,
      sales,
      operatingProfit,
      netIncome
    ) {

      var data = {

        month:
          month,

        company:
          company,

        sales:
          sales,

        operatingProfit:
          operatingProfit,

        netIncome:
          netIncome

      };


      var response =
        await fetch(
          API_URL,
          {

            method:
              "POST",

            headers:
              {
                "Content-Type":
                  "text/plain"
              },

            body:
              JSON.stringify(data)

          }
        );


      return await response.json();

    }

  </script>

</body>
</html>
```
