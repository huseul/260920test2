<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>연결재무실적</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <div>
      <h1>연결재무실적</h1>
      <p>회사별 월간 실적을 한눈에 확인하세요.</p>
    </div>

    <div class="month-select">

      <label for="month">실적월</label>

      <select id="month">
        <option value="2026년 7월">2026년 7월</option>
      </select>

    </div>

  </header>


  <nav class="nav">
    <a href="index.html" class="active">매출액</a>
    <a href="profit.html">이익</a>
  </nav>


  <main class="container">

    <section class="page-title">

      <div>
        <span id="monthTitle" class="eyebrow">
          2026년 7월
        </span>

        <h2>회사별 매출액</h2>
      </div>

      <span class="unit">단위 : 억원</span>

    </section>


    <div id="loading" class="message">
      데이터를 불러오는 중입니다...
    </div>

    <div id="error" class="message error-message"></div>


    <section class="chart-card">

      <div class="chart-header">

        <div>
          <h3>매출액</h3>
          <p>회사별 매출액을 비교해보세요.</p>
        </div>

      </div>


      <div class="chart-scroll">

        <div id="salesChart" class="chart"></div>

      </div>

    </section>

  </main>


  <script>


    /*
     * Google Apps Script 웹앱 주소
     */
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwpXgcyI4FnRwRhrsEfAfjvAbWk4jy3kTl0p0lN6lGjw4nqFcGWdN_TUp_iiW4Fm8PmtQ/exec";


    /*
     * Google Sheet의 금액은 원 단위
     *
     * 100,000,000원 = 1억원
     */
    const WON_PER_EOK = 100000000;


    /*
     * 월 선택
     */
    const monthSelect =
      document.getElementById("month");


    /*
     * 월 제목
     */
    const monthTitle =
      document.getElementById("monthTitle");


    /*
     * 페이지가 열리면
     * 기본적으로 2026년 7월 데이터를 가져옵니다.
     */
    loadData(monthSelect.value);


    /*
     * 월을 변경하면
     * 해당 월의 데이터를 다시 가져옵니다.
     */
    monthSelect.addEventListener(
      "change",
      function() {

        const selectedMonth =
          monthSelect.value;


        monthTitle.textContent =
          selectedMonth;


        loadData(selectedMonth);

      }
    );


    /*
     * Google Sheets에서
     * 선택한 월의 데이터를 가져옵니다.
     */
    async function loadData(month) {

      const loading =
        document.getElementById("loading");

      const error =
        document.getElementById("error");


      loading.style.display = "block";

      error.style.display = "none";


      try {


        /*
         * 월 정보를 URL에 붙입니다.
         *
         * 예:
         * ?month=2026년%207월
         */
        const url =
          API_URL +
          "?month=" +
          encodeURIComponent(month);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "데이터를 불러오지 못했습니다."
          );

        }


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            "데이터를 불러오지 못했습니다."
          );

        }


        /*
         * 매출액 그래프를 그립니다.
         */
        drawSalesChart(
          result.data
        );
